# QCFP-MTF Requirement Traceability Matrix（流程治理 Sprint A #3）
#
# 连接：Specification → Architecture → Code → Test → Evidence → Release。
# 每条 P0 需求必须全连通：
#   spec_id + requirement + architecture_rule + authority + production_modules
#   + tests + evidence + release_gate
# 审计：traceability.py::audit_traceability（Orphan Requirement=ERROR /
#   Orphan Test=REVIEW / Orphan Production Capability=RESEARCH_ONLY）。
# tests 引用的是仓库内真实存在的 test_* 函数（scan_tests_index 校验）。

- spec_id: QCFP-SPEC-INV-001
  requirement: Permission cannot be upgraded by any signal
  architecture_rule: [RULE-01, RULE-02, RULE-07]
  authority: decision.institutional_permission
  production_modules:
    - decision.engine
    - decision.institutional_permission
    - decision.permission_policy
    - decision.participation_budget
  tests:
    - test_permission_monotonicity
    - test_permission_risk_increase_invariant
    - test_i10_wave_cannot_upgrade_permission
    - test_invariant_3_daily_cannot_upgrade_permission
    - test_daily_signal_cannot_raise_permission
    - test_block_cannot_be_upgraded_by_daily_breakout
  failure_injection:
    - test_inject_wave_outcome_into_production
  evidence:
    - golden_result.json
    - authority_graph.json
  release_gate: [CONSTITUTION_GATE, CHANGE_IMPACT_GATE, AUTHORITY_AUDIT]

